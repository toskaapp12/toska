name: CI

# Runs on every PR and on every push to main. Catches:
#   - broken firestore.rules (the unit-test suite under firestore-tests/)
#   - syntax errors in Cloud Functions JS that would silently fail to deploy
#   - Swift↔JS moderation-detector divergence (detector-parity, macOS lane)
#   - GDPR deletion-cascade residue on staging (inert until WIF SA is set up
#     — see the deletion-cascade-staging job's comment)
# Does not yet build the iOS app — that needs GoogleService-Info.plist
# decoded from a secret on a macOS runner. RUNBOOK.md describes the
# setup if/when we want to add it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run if a new commit lands on the same branch — saves
# minutes when iterating on a PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Firestore rules unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: firestore-tests/package-lock.json

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install firebase-tools
      # Pinned to the major version Firebase docs reference. firebase-tools
      # 15+ requires Java 21 (set up above).
      run: npm install -g firebase-tools@15

    - name: Install test dependencies
      working-directory: firestore-tests
      run: npm install --no-audit --no-fund

    # crisis-parity.mjs (part of test:pins) requires ../functions/index.js to
    # read the deployed crisis lists, and index.js needs firebase-functions
    # et al from functions/node_modules. Without this install the job dies
    # with "Cannot find module 'firebase-functions/v2/firestore'" — the exact
    # pre-existing failure that had CI red on main since the pin was added
    # (found 2026-07-28 while promoting detector-parity, A.5 #8).
    - name: Install Cloud Functions dependencies
      working-directory: functions
      run: npm install --no-audit --no-fund

    - name: Run rules unit tests
      working-directory: firestore-tests
      # Calls the package.json `test` script so CI uses the exact same
      # command users run locally — single source of truth. The script's
      # macOS-specific PATH prefix (/opt/homebrew/opt/openjdk@21/bin) is
      # harmless on Linux since setup-java already put Java 21 on PATH.
      run: npm test

  functions-syntax:
    name: Cloud Functions syntax check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Syntax-check JS files
      # node --check parses each file without executing. Catches typos that
      # would land in production and silently fail at function cold-start.
      run: |
        node --check functions/index.js
        node --check functions/cleanup.js
        node --check functions/scrubLegacyPII.js
        node --check functions/backfillReplyModerationStatus.js

  functions-tests:
    name: Cloud Functions unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install firebase-tools
      run: npm install -g firebase-tools@15

    # functions-tests/functions.test.js requires ../functions/index.js, which
    # needs firebase-admin from functions/node_modules.
    - name: Install Cloud Functions dependencies
      working-directory: functions
      run: npm install --no-audit --no-fund

    - name: Install test dependencies
      working-directory: functions-tests
      run: npm install --no-audit --no-fund

    - name: Run Cloud Functions unit tests
      working-directory: functions-tests
      # The package.json script's macOS openjdk PATH prefix is harmless on
      # Linux since setup-java already put Java 21 on PATH.
      run: npm test

  # 2026-07-28 (system-review A.5 #8): the Swift↔JS parity pin, promoted from
  # manual-only. It extracts the REAL name detector + crisis matcher from
  # toska/ContentModeration.swift, compiles them with swiftc (hence the macOS
  # runner), and runs the shared corpora through Swift AND JS — so a server
  # moderation change that diverges the hand-mirrored iOS side now fails CI
  # instead of waiting for someone to remember the manual run. Zero npm deps:
  # node builtins + swiftc only.
  detector-parity:
    name: Swift-JS detector parity (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run detector-parity pin
      working-directory: firestore-tests
      run: node detector-parity.mjs

  # 2026-07-28 (system-review A.5 #8): the GDPR deletion-cascade probe against
  # LIVE STAGING, promoted from manual-only — the launch-critical "no residue
  # after account deletion" guarantee gets re-proven on every push to main.
  #
  # INERT until the owner completes two one-time steps:
  #   1. Create the probe service account + WIF binding on toskastaging
  #      (same keyless WIF pattern as deploy-rules-staging above — the org
  #      policy blocks JSON keys anyway). The probe creates/deletes staging
  #      Auth users and writes/deletes Firestore docs, so it needs:
  #        gcloud iam service-accounts create github-actions-staging-probes \
  #          --project=toskastaging
  #        gcloud projects add-iam-policy-binding toskastaging \
  #          --member="serviceAccount:github-actions-staging-probes@toskastaging.iam.gserviceaccount.com" \
  #          --role=roles/datastore.owner
  #        gcloud projects add-iam-policy-binding toskastaging \
  #          --member="serviceAccount:github-actions-staging-probes@toskastaging.iam.gserviceaccount.com" \
  #          --role=roles/firebaseauth.admin
  #        gcloud iam service-accounts add-iam-policy-binding \
  #          github-actions-staging-probes@toskastaging.iam.gserviceaccount.com \
  #          --project=toskastaging --role=roles/iam.workloadIdentityUser \
  #          --member="principalSet://iam.googleapis.com/projects/260913424323/locations/global/workloadIdentityPools/github-actions/attribute.repository/toskaapp12/toska"
  #   2. Set repo variable RUN_STAGING_PROBES=true (Settings → Secrets and
  #      variables → Actions → Variables).
  # Push-to-main only (WIF id-tokens aren't issuable from fork PRs, and PR
  # runs shouldn't touch live staging).
  deletion-cascade-staging:
    name: GDPR deletion-cascade probe (staging)
    runs-on: ubuntu-latest
    needs: rules-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUN_STAGING_PROBES == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: firestore-tests/package-lock.json

    - name: Install test dependencies
      working-directory: firestore-tests
      run: npm install --no-audit --no-fund

    - name: Auth to Google Cloud via Workload Identity Federation
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/260913424323/locations/global/workloadIdentityPools/github-actions/providers/github
        service_account: github-actions-staging-probes@toskastaging.iam.gserviceaccount.com

    - name: Run deletion-cascade probe against staging
      working-directory: firestore-tests
      run: node deletion-cascade.mjs

  # Auto-deploys firestore.rules to staging on every push to main, gated
  # on the rules-tests job passing. Closes the staging-drift gap surfaced
  # by the 2026-05-04 Tier 2 #4 dry-run, where staging's deployed rules
  # had silently fallen behind prod's because forward deploys to staging
  # weren't part of any team workflow. Now they are.
  #
  # Skipped on PRs: id-token isn't issuable from PRs opened from forks
  # (a GitHub security default), and we don't want PR runs touching
  # staging's deployed rules anyway.
  #
  # Prod is intentionally NOT auto-deployed. Rules changes still go through
  # `firebase deploy --only firestore:rules` from a developer machine,
  # after manual verification on staging. See RUNBOOK.md → Deploy
  # procedures and Rollback procedures.
  #
  # Auth: Workload Identity Federation. GitHub mints a short-lived OIDC
  # token for this run, exchanges it via STS for a Google access token
  # scoped to the github-actions-rules-deploy service account on
  # toskastaging. No long-lived service-account JSON key is stored on
  # GitHub. The toskastaging GCP org enforces the
  # iam.disableServiceAccountKeyCreation policy ("Secure by Default")
  # which blocks the JSON-key approach anyway, so WIF is the only path.
  #
  # GCP-side setup (one-time, already done — documented for future-you):
  #   gcloud iam workload-identity-pools create github-actions \
  #     --project=toskastaging --location=global
  #   gcloud iam workload-identity-pools providers create-oidc github \
  #     --project=toskastaging --location=global \
  #     --workload-identity-pool=github-actions \
  #     --attribute-mapping=google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.repository_owner=assertion.repository_owner \
  #     --attribute-condition="assertion.repository_owner == 'toskaapp12'" \
  #     --issuer-uri=https://token.actions.githubusercontent.com
  #   gcloud iam service-accounts add-iam-policy-binding \
  #     github-actions-rules-deploy@toskastaging.iam.gserviceaccount.com \
  #     --project=toskastaging --role=roles/iam.workloadIdentityUser \
  #     --member="principalSet://iam.googleapis.com/projects/260913424323/locations/global/workloadIdentityPools/github-actions/attribute.repository/toskaapp12/toska"
  #
  # The per-repo security boundary lives in the `attribute.repository/toskaapp12/toska`
  # selector on the principalSet above — NOT in the provider's attribute_condition,
  # which is intentionally org-wide (`repository_owner == 'toskaapp12'`) so the same
  # provider is reusable for future SAs. If you add another SA binding here, use the
  # same per-repo principalSet form. Do NOT use `attribute.repository_owner/toskaapp12`
  # in a binding — that would silently let any repo in the toskaapp12 org impersonate
  # that SA.
  deploy-rules-staging:
    name: Deploy rules to staging
    runs-on: ubuntu-latest
    needs: rules-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # Required for google-github-actions/auth to mint the OIDC token
      # GitHub presents to Google STS. Without this, auth silently fails
      # with "the GitHub Action workflow must specify ... ".
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install firebase-tools
      run: npm install -g firebase-tools@15

    - name: Auth to Google Cloud via Workload Identity Federation
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/260913424323/locations/global/workloadIdentityPools/github-actions/providers/github
        service_account: github-actions-rules-deploy@toskastaging.iam.gserviceaccount.com

    - name: Deploy firestore.rules to staging
      # Idempotent: if the rules content hash matches what's already
      # deployed, firebase-tools logs "already up to date, skipping
      # upload" and exits 0. So this job is safe to re-run on commits
      # that don't touch rules — no wasted writes, no rule-version churn.
      run: firebase deploy --only firestore:rules --project toskastaging --non-interactive
