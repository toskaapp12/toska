name: Security Watch

# The always-on half of toska's safety system (owner 2026-09-27: "constantly
# checking the security of the app"). CI (ci.yml) guards every CHANGE; this
# watches the LIVE product on a schedule — deployed site posture, dependency
# vulnerabilities, endpoint health — so drift or a newly-disclosed vuln
# surfaces within hours, not at the next deploy.
#
# On failure GitHub emails the repo owner (default notification settings).

on:
  schedule:
    # Every 6 hours — frequent enough to catch a bad deploy or fresh CVE
    # same-day, light enough to stay far inside free-tier minutes.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}   # manual "run it now" button in the Actions tab

permissions:
  contents: read

jobs:
  live-web-audit:
    name: Live site audit (headers, bundle, endpoints)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
      with:
        node-version: '22'
    # LIVE=1 adds the deployed-site checks: security headers actually served,
    # the deployed bundle carrying the current feature pins (catches
    # fixed-locally-never-deployed drift), share-page 404 behavior.
    - name: Web security audit against app.toskaapp.com
      run: LIVE=1 node scripts/audit_web_security.mjs

  dependency-vulnerabilities:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
      with:
        node-version: '22'
    # Production dependency trees only; fails on HIGH or CRITICAL advisories.
    # (Moderates are reviewed manually — the current 9 need a breaking
    # firebase-admin major and are accepted; see 2026-09-21 security audit.)
    - name: Cloud Functions prod deps
      working-directory: functions
      run: |
        npm install --no-audit --no-fund --omit=dev
        npm audit --omit=dev --audit-level=high

  endpoint-health:
    name: Public endpoint health
    runs-on: ubuntu-latest
    steps:
    - name: Web app + share page + sitemap respond
      run: |
        set -e
        check () {
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$1")
          echo "$1 -> $code"
          [ "$code" = "$2" ] || { echo "EXPECTED $2"; exit 1; }
        }
        # Cold-start tolerant: /sitemap.xml is a scale-to-zero Cloud Function hit
        # only by crawlers + this check (~handful of requests/day), so the FIRST
        # packet to a sleeping instance can occasionally 500 during
        # scale-from-zero (verified 2026-10-22: 0-latency 500, no handler log, no
        # container crash — a transient GFE race, not a bug or outage). Retry
        # ONCE after a 10s warmup before failing. Still requires 200 — measures
        # "does it serve?", not "does it serve the first cold packet?". Does NOT
        # weaken any other check.
        check_warm () {
          local code
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$1")
          echo "$1 -> $code (attempt 1)"
          if [ "$code" != "$2" ]; then
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$1")
            echo "$1 -> $code (attempt 2, after warmup)"
            [ "$code" = "$2" ] || { echo "EXPECTED $2 after retry"; exit 1; }
          fi
        }
        check "https://app.toskaapp.com/" 200
        check "https://app.toskaapp.com/js/app.js" 200
        check "https://app.toskaapp.com/p/definitely-not-a-real-post" 404
        check_warm "https://app.toskaapp.com/sitemap.xml" 200
