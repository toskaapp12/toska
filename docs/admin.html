<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content-Security-Policy (#1 security re-review, 2026-06-11): the dashboard
         renders all user content via textContent (verified XSS-safe), so this is
         defense-in-depth — it neutralizes any FUTURE regression that introduced an
         injected <script>/<img onerror>. object-src/base-uri 'none' kill plugin +
         <base> hijack; script-src is pinned to self + the gstatic Firebase CDN
         ('unsafe-inline' is required because the app logic is an inline module and
         GitHub Pages can't serve a nonce). connect-src allows Firebase backends. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.googleapis.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com https://www.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://firestore.googleapis.com wss://*.firebaseio.com https://www.google.com https://www.recaptcha.net; frame-src https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
    <title>toska admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0908; color: #e0e2e6; min-height: 100vh; }
        .login { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; }
        .login h1 { font-family: Georgia, serif; font-style: italic; font-size: 28px; color: #fff; margin-bottom: 8px; }
        .login input { background: #1a1c22; border: 1px solid #2a2c32; color: #e0e2e6; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 280px; }
        .login button { background: #4a6fa5; color: #fff; border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .login button:hover { background: #5a7fb5; }
        .login .error { color: #c45c5c; font-size: 12px; }
        .header { padding: 16px 24px; border-bottom: 1px solid #1c1e1f; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-family: Georgia, serif; font-style: italic; font-size: 18px; color: #fff; }
        .header .right { display: flex; gap: 12px; align-items: center; }
        .header .stat { font-size: 11px; color: #85898f; }
        .header .stat strong { color: #e0e2e6; }
        .header button { background: none; border: 1px solid #2a2c32; color: #85898f; padding: 6px 14px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .tabs { display: flex; gap: 4px; padding: 12px 24px; border-bottom: 1px solid #1c1e1f; }
        .tabs button { background: none; border: none; color: #85898f; font-size: 12px; padding: 6px 14px; border-radius: 16px; cursor: pointer; }
        .tabs button.active { background: #1c1e1f; color: #e0e2e6; font-weight: 600; }
        .tab-count { display: inline-block; margin-left: 6px; min-width: 16px; padding: 1px 6px; border-radius: 9px; background: #2a2c32; color: #c0c3c8; font-size: 10px; font-weight: 600; line-height: 1.4; }
        .tabs button.active .tab-count { background: #4a6fa5; color: #fff; }
        .tab-count[hidden] { display: none; }
        .queue-heading { font-family: Georgia, serif; font-style: italic; font-size: 13px; color: #85898f; margin-bottom: 12px; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
        .content { max-width: 800px; margin: 0 auto; padding: 16px 24px; }
        .card { background: #121314; border: 1px solid #1c1e1f; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .card-type { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 4px; }
        .type-post { background: #4a6fa520; color: #4a6fa5; }
        .type-reply { background: #8b7ec820; color: #8b7ec8; }
        .type-user { background: #c49a6c20; color: #c49a6c; }
        .type-conversation { background: #6ba58e20; color: #6ba58e; }
        .card-time { font-size: 10px; color: #555960; }
        .card-reason { font-size: 11px; color: #c45c5c; margin-bottom: 6px; }
        .card-text { font-family: Georgia, serif; font-size: 14px; color: #b0b3b8; line-height: 1.6; margin-bottom: 10px; padding: 12px; background: #0a0908; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
        .card-meta { font-size: 10px; color: #555960; margin-bottom: 12px; }
        .card-meta span { margin-right: 12px; }
        .card-actions { display: flex; gap: 8px; }
        .card-actions button { border: none; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; }
        .btn-dismiss { background: #1c1e1f; color: #85898f; }
        .btn-dismiss:hover { background: #2a2c32; }
        .btn-remove { background: #c45c5c20; color: #c45c5c; }
        .btn-remove:hover { background: #c45c5c30; }
        .btn-restrict { background: #c49a6c20; color: #c49a6c; }
        .btn-restrict:hover { background: #c49a6c30; }
        .empty { text-align: center; padding: 60px 20px; color: #555960; }
        .empty h2 { font-family: Georgia, serif; font-style: italic; font-size: 18px; color: #85898f; margin-bottom: 8px; }
        .flagged-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 4px; background: #c45c5c15; color: #c45c5c; }
        .status-resolved { opacity: 0.4; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c1e1f; color: #6ba58e; padding: 10px 20px; border-radius: 8px; font-size: 12px; display: none; z-index: 100; border: 1px solid #6ba58e30; }
        .loading { text-align: center; padding: 40px; color: #555960; }
        /* H-1: 24-hour SLA visibility. ReportSheet promises "reports are
           reviewed within 24 hours"; this styling surfaces which pending
           reports are nearing or past that threshold so the admin can
           triage them first. .overdue uses the same red as .card-reason
           to draw the eye; .aging is amber for the 12–24h band. */
        .card.overdue { border-color: #c45c5c80; }
        .card.aging { border-color: #c49a6c60; }
        .sla-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
        .sla-overdue { background: #c45c5c20; color: #c45c5c; }
        .sla-aging { background: #c49a6c20; color: #c49a6c; }
        .header .stat.overdue strong { color: #c45c5c; }
    </style>
</head>
<body>
    <div id="loginView" class="login" style="display:none;">
        <h1>toska admin</h1>
        <input type="email" id="email" placeholder="email" autocomplete="email">
        <input type="password" id="password" placeholder="password" autocomplete="current-password">
        <button id="signInBtn">sign in</button>
        <div id="loginError" class="error"></div>
    </div>

    <div id="appView" style="display:none;">
        <div class="header">
            <h1>toska admin</h1>
            <div class="right">
                <span class="stat">pending: <strong id="pendingCount">0</strong></span>
                <span class="stat overdue">overdue: <strong id="overdueCount">0</strong></span>
                <span class="stat">flagged: <strong id="flaggedCount">0</strong></span>
                <button id="signOutBtn">sign out</button>
            </div>
        </div>
        <div class="tabs" role="tablist" aria-label="moderation queues">
            <button class="active" role="tab" aria-selected="true" data-tab="reports">reports<span class="tab-count" data-count="reports" hidden></span></button>
            <button role="tab" aria-selected="false" data-tab="pending">pending posts<span class="tab-count" data-count="pending" hidden></span></button>
            <button role="tab" aria-selected="false" data-tab="pendingReplies">pending replies<span class="tab-count" data-count="pendingReplies" hidden></span></button>
            <button role="tab" aria-selected="false" data-tab="flagged">flagged posts<span class="tab-count" data-count="flagged" hidden></span></button>
            <button role="tab" aria-selected="false" data-tab="crisis">crisis<span class="tab-count" data-count="crisis" hidden></span></button>
            <button role="tab" aria-selected="false" data-tab="restricted">restricted users<span class="tab-count" data-count="restricted" hidden></span></button>
        </div>
        <div class="content" id="content" role="tabpanel" aria-live="polite">
            <div class="loading">loading...</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        // ============================================================
        // SECURITY NOTE — admin.html
        //
        // This page IS publicly accessible: docs/CNAME points at
        // www.toskaapp.com and the /docs directory is served via GitHub
        // Pages. (The previous comment claiming "not publicly served" was
        // outdated — only the firebase.json hosting block was missing.)
        //
        // The security perimeter is therefore the Firestore rules:
        //   - admins/{uid} read: if isOwner(uid)  → admin status check
        //   - reports update: isAdmin()           → resolve / dismiss
        //   - users update {restricted, ...}: isAdmin() → restrict / unrestrict
        //   - posts update {flagged}: isAdmin()   → unflag / delete
        // A non-admin who signs in here passes the auth gate but every
        // privileged write is denied server-side.
        //
        // Defense-in-depth applied below:
        //   1. All user-controlled strings (handles, reason labels, text,
        //      post IDs) are rendered via .textContent or DOM API helpers
        //      that auto-escape — no innerHTML interpolation. This blocks
        //      stored-XSS via crafted handles that would otherwise run JS
        //      in the admin's authenticated session and hijack moderation
        //      privileges (the realistic attack class).
        //   2. firestore.rules also constrains handles to
        //      ^[a-zA-Z0-9_-]+$ at create + update, so the dangerous
        //      payload can't even land in Firestore in the first place.
        //
        // Recommended next step: enable Firebase App Check with a
        // reCAPTCHA Enterprise provider (the initializeAppCheck call
        // below) so non-attested origins can't hit Firestore even with
        // a stolen ID token. The site key is a public identifier — safe
        // to commit once you have one.
        // ============================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, collectionGroup, query, where, orderBy, limit, startAfter, getDocs, getCountFromServer, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Web app config (NOT iOS). App Check is registered per-app, so
        // the dashboard needs its own Web appId — using the iOS appId
        // here would mean Firestore App Check enforcement rejects every
        // request from this page. Web appId created 2026-05-31 in prod.
        const app = initializeApp({
            apiKey: "AIzaSyBrw_EFSHD2lMr7RqQd7sM9-2jMnr2tzdQ",
            authDomain: "toska-4ebf4.firebaseapp.com",
            projectId: "toska-4ebf4",
            storageBucket: "toska-4ebf4.firebasestorage.app",
            messagingSenderId: "183467627187",
            appId: "1:183467627187:web:fd3f93867a2a54f90756c6"
        });

        // App Check via reCAPTCHA Enterprise. Once a site key is set
        // below, every Firestore read/write from this dashboard carries
        // an App Check token; combined with the iOS client's App Attest
        // enforcement, this restricts all Firestore traffic to attested
        // toska clients. A non-attested origin (random browser tab,
        // headless scraper, stolen admin session moved to another
        // device) is rejected at the API layer even with a valid auth
        // token.
        //
        // To enable:
        //   1. Cloud Console → reCAPTCHA Enterprise → Create key →
        //      type: web, allowed domains: www.toskaapp.com
        //   2. Copy the site key (starts with 6L... — public, safe to
        //      commit) and replace RECAPTCHA_SITE_KEY below
        //   3. Firebase Console → App Check → Web app → register the
        //      reCAPTCHA Enterprise provider with the same site key
        //   4. Wait for the unverified-request rate to drop near zero in
        //      the App Check metrics, then flip enforcement to "Enforced"
        //      on Cloud Firestore
        //
        // Until step 2 is done, the constant below stays empty and the
        // initializeAppCheck call is skipped — the dashboard keeps
        // working without App Check. No fail-closed surprise.
        // reCAPTCHA Enterprise key for www.toskaapp.com / toskaapp.com,
        // attached to the Web app's App Check config 2026-05-31. Public
        // identifier; safe to commit.
        //
        // Prod App Check is ENFORCED on both Firestore and Auth (verified
        // 2026-06-11), so this site key must stay valid for the dashboard to
        // reach Firestore; firestore.rules remain the authoritative perimeter.
        const RECAPTCHA_SITE_KEY = "6LfKrQUtAAAAAIMrSCA0WW4UoY1cPe9iONaQLHBP";
        if (RECAPTCHA_SITE_KEY) {
            // Wrapped in try/catch so an App Check / reCAPTCHA init failure
            // (e.g. the page loaded on a domain the reCAPTCHA key doesn't
            // accept) can NOT halt the rest of the script — otherwise the
            // top-level await throws here and onAuthStateChanged never
            // registers, leaving the login hidden and the page black.
            try {
                const { initializeAppCheck, ReCaptchaEnterpriseProvider } =
                    await import("https://www.gstatic.com/firebasejs/11.0.1/firebase-app-check.js");
                initializeAppCheck(app, {
                    provider: new ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY),
                    isTokenAutoRefreshEnabled: true,
                });
            } catch (e) {
                // Surface it in the login error area instead of black-screening.
                console.error("App Check init failed:", e);
                const le = document.getElementById("loginError");
                if (le) le.textContent = "app check init failed (" + (e.code || e.message) + ") — try www.toskaapp.com";
            }
        }

        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentTab = "reports";

        // --- DOM helpers ---
        // setText / setTextChild / appendSpan all route user-controlled
        // strings through textContent or document.createTextNode, which
        // auto-escape into a text node — no chance of HTML/JS injection
        // even if the string contains <, >, ', ", & or other markup.

        function el(tag, className) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            return node;
        }

        function span(className, text) {
            const s = el("span", className);
            s.textContent = text ?? "";
            return s;
        }

        function emptyState(container, title, body) {
            container.replaceChildren();
            const wrap = el("div", "empty");
            const h2 = el("h2");
            h2.textContent = title;
            const p = el("p");
            p.textContent = body;
            wrap.append(h2, p);
            container.appendChild(wrap);
        }

        function loadingState(container, message = "loading...") {
            container.replaceChildren();
            const wrap = el("div", "loading");
            wrap.textContent = message;
            container.appendChild(wrap);
        }

        // Type tag — bounded by firestore.rules to one of four enum
        // values, but we still treat it carefully: only attach the
        // class suffix if the value matches the allowlist.
        const ALLOWED_TYPES = new Set(["post", "reply", "user", "conversation"]);
        function typeBadge(type) {
            const safeType = ALLOWED_TYPES.has(type) ? type : "post";
            const s = span(`card-type type-${safeType}`);
            s.textContent = safeType;
            return s;
        }

        // metaRow — builds a `.card-meta` row from a list of label strings
        // (or pre-built nodes). Strings route through span()/textContent so
        // user-controlled values (handles, ids) can never inject markup.
        // Falsy entries are skipped so callers can conditionally include rows.
        function metaRow(entries) {
            const meta = el("div", "card-meta");
            entries.forEach(entry => {
                if (entry == null || entry === false) return;
                meta.appendChild(typeof entry === "string" ? span(null, entry) : entry);
            });
            return meta;
        }

        // restrictAuthorButton — the "restrict author" block was pasted
        // verbatim in the pending / pending-reply / crisis / flagged loaders.
        // One factory: same .btn-restrict styling, same confirm()/restrict
        // path (restrictUserDirect). Returns null when there's no author id
        // so callers can spread it into an actions array and have it drop out.
        // The handle is only ever shown via confirm()/showToast (plain text).
        function restrictAuthorButton(authorId, handle) {
            if (!authorId) return null;
            const btn = el("button", "btn-restrict");
            btn.textContent = "restrict author";
            btn.setAttribute("aria-label", `restrict author ${handle || authorId}`);
            btn.addEventListener("click", () => restrictUserDirect(authorId, handle || ""));
            return btn;
        }

        // renderCard — single card-skeleton builder shared by every queue
        // loader. Preserves the exact DOM structure the loaders built by
        // hand: optional leading checkbox, a header (left-side badge group +
        // right-side time), optional reason line, optional text body, a meta
        // row, and an actions row. EVERY text value flows through
        // span()/textContent/metaRow — no innerHTML — so the XSS-safe
        // invariant holds no matter what user content a field carries.
        //
        // opts:
        //   id          → card element id (used by action handlers to remove it)
        //   extraClass  → extra class on .card (e.g. "overdue" / "aging")
        //   leading     → node placed first inside the header (e.g. checkbox)
        //   headerLeft  → array of badge nodes for the header's left side,
        //                 appended directly (matching the original loaders).
        //   groupHeaderLeft → wrap headerLeft in a flex container so the time
        //                 sits opposite the whole group (the reports layout).
        //   time        → right-aligned card-time text
        //   reason      → card-reason text (skipped when falsy)
        //   text        → card-text body (skipped when falsy/empty)
        //   meta        → array passed to metaRow()
        //   actions     → array of button nodes (nulls skipped)
        function renderCard(opts) {
            const card = el("div", "card" + (opts.extraClass ? " " + opts.extraClass : ""));
            if (opts.id) card.id = opts.id;

            const header = el("div", "card-header");
            if (opts.leading) header.appendChild(opts.leading);

            const leftNodes = (opts.headerLeft || []).filter(Boolean);
            if (opts.groupHeaderLeft) {
                // reports layout: badges share a flex container so the time
                // span sits opposite the whole group (justify-content:
                // space-between). Other queues append badges directly.
                const headerLeft = el("div");
                headerLeft.style.display = "flex";
                headerLeft.style.alignItems = "center";
                leftNodes.forEach(n => headerLeft.appendChild(n));
                header.appendChild(headerLeft);
            } else {
                leftNodes.forEach(n => header.appendChild(n));
            }
            header.appendChild(span("card-time", opts.time ?? ""));
            card.appendChild(header);

            if (opts.reason) {
                const reasonDiv = el("div", "card-reason");
                reasonDiv.textContent = opts.reason;
                card.appendChild(reasonDiv);
            }

            if (opts.text) {
                const textDiv = el("div", "card-text");
                textDiv.textContent = opts.text;
                card.appendChild(textDiv);
            }

            if (opts.meta) card.appendChild(metaRow(opts.meta));

            const actions = el("div", "card-actions");
            (opts.actions || []).filter(Boolean).forEach(b => actions.appendChild(b));
            card.appendChild(actions);

            return card;
        }

        // queueHeading — visible italic heading for the active queue region so
        // the tabpanel has a labelled heading (a11y) instead of just cards.
        function queueHeading(text) {
            const h = el("h2", "queue-heading");
            h.textContent = text;
            return h;
        }

        // --- Auth wiring ---

        document.getElementById("signInBtn").addEventListener("click", signIn);
        document.getElementById("signOutBtn").addEventListener("click", () => fbSignOut(auth));
        document.querySelectorAll(".tabs button[data-tab]").forEach(btn => {
            btn.addEventListener("click", () => switchTab(btn.dataset.tab, btn));
        });

        async function signIn() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errEl = document.getElementById("loginError");
            errEl.textContent = "";
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                errEl.textContent = e.message;
            }
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll(".tabs button").forEach(b => {
                b.classList.remove("active");
                b.setAttribute("aria-selected", "false");
            });
            btn.classList.add("active");
            btn.setAttribute("aria-selected", "true");
            loadTab();
        }

        // --- Header count badges ---
        //
        // One getCountFromServer (aggregation) read per queue so a moderator
        // sitting on the default tab can SEE that e.g. flagged has 12 waiting
        // without opening it. Aggregation queries bill ~1 read each and don't
        // stream the docs, so this is cheap. Refreshed on login, on tab load,
        // and after any action that resolves an item. The crisis count is the
        // raw concerningContent total (the loader additionally filters out
        // already-reviewed posts client-side), so it's an upper bound — still
        // useful as a "needs attention" signal.
        function countQueries() {
            return {
                reports: query(collection(db, "reports"), where("status", "==", "pending")),
                pending: query(collection(db, "posts"), where("moderationStatus", "==", "pending_review")),
                pendingReplies: query(collectionGroup(db, "replies"), where("moderationStatus", "==", "pending_review")),
                flagged: query(collection(db, "posts"), where("flagged", "==", true)),
                crisis: query(collection(db, "posts"), where("concerningContent", "==", true)),
                restricted: query(collection(db, "users"), where("restricted", "==", true)),
            };
        }

        function setTabCount(tab, n) {
            const badge = document.querySelector(`.tab-count[data-count="${tab}"]`);
            if (!badge) return;
            if (typeof n === "number" && n > 0) {
                badge.textContent = String(n);
                badge.hidden = false;
                const btn = badge.closest("button");
                if (btn) btn.setAttribute("aria-label", `${btn.dataset.tab} (${n} waiting)`);
            } else {
                badge.textContent = "";
                badge.hidden = true;
            }
        }

        async function refreshCounts() {
            const queries = countQueries();
            await Promise.all(Object.entries(queries).map(async ([tab, q]) => {
                try {
                    const snap = await getCountFromServer(q);
                    setTabCount(tab, snap.data().count);
                } catch (e) {
                    // A failed aggregation read (e.g. missing index) must never
                    // break the dashboard — just leave that badge hidden.
                    setTabCount(tab, 0);
                }
            }));
        }

        onAuthStateChanged(auth, async (user) => {
            const errEl = document.getElementById("loginError");
            if (user) {
                try {
                    const adminDoc = await getDoc(doc(db, "admins", user.uid));
                    if (adminDoc.exists() && adminDoc.data().role === "admin") {
                        document.getElementById("loginView").style.display = "none";
                        document.getElementById("appView").style.display = "block";
                        loadTab();
                        refreshCounts();
                    } else {
                        errEl.textContent = "not an admin account";
                        await fbSignOut(auth);
                        document.getElementById("loginView").style.display = "flex";
                    }
                } catch (e) {
                    errEl.textContent = "permission error reading admin doc: " + (e.code || e.message);
                }
            } else {
                document.getElementById("loginView").style.display = "flex";
                document.getElementById("appView").style.display = "none";
            }
        });

        async function loadTab() {
            const content = document.getElementById("content");
            loadingState(content);
            if (currentTab === "reports") await loadReports(content);
            else if (currentTab === "pending") await loadPending(content);
            else if (currentTab === "pendingReplies") await loadPendingReplies(content);
            else if (currentTab === "flagged") await loadFlagged(content);
            else if (currentTab === "crisis") await loadCrisis(content);
            else if (currentTab === "restricted") await loadRestricted(content);
            refreshCounts();
        }

        // --- Pending review ---
        //
        // Surfaces posts where moderationStatus == "pending_review" — the new
        // (2026-05-31) hold-for-admin queue. Posts land here when:
        //   - validatePost detects PII (names/addresses) — reason="pii"
        //   - onPostCreated detects abuse patterns — reason="abuse_*"
        //   - onPostCreated detects crisis language — reason="crisis"
        //   - onReportCreatedAutoHide sees 3+ distinct user reports in 24h —
        //     reason="user_reports"
        // Author + admins are the only ones who can read the post until it's
        // approved (flipped back to "live") or removed.
        //
        // Approve flips moderationStatus to "live" so the iOS feed query
        // (whereField moderationStatus == "live") starts returning it again.
        // Remove uses the existing deletePost path. Restrict author uses the
        // existing restrict path.
        //
        // Ordered by pendingDetectedAt DESC so newest holds surface first.
        // Index requirement: posts(moderationStatus ASC, pendingDetectedAt DESC).

        const PENDING_REASON_LABELS = {
            pii: "names / contact info",
            crisis: "crisis language",
            abuse_hate: "hateful language",
            abuse_harassment: "harassment",
            abuse_threat: "threatening language",
            abuse_sexual: "sexual content",
            abuse_link: "contains link",
            abuse_spam: "spam / commercial",
            user_reports: "user reports (3+)",
        };

        async function loadPending(container) {
            try {
                const q = query(
                    collection(db, "posts"),
                    where("moderationStatus", "==", "pending_review"),
                    orderBy("pendingDetectedAt", "desc"),
                    limit(50)
                );
                const snap = await getDocs(q);
                if (snap.empty) {
                    emptyState(container, "no posts pending review", "auto-detection is keeping the queue clear");
                    return;
                }
                container.replaceChildren();
                container.appendChild(queueHeading("posts held for review"));

                // Bulk approve. The queue is dominated by recoverable PII/name
                // false positives (e.g. "I miss John"); let the admin tick the
                // obvious ones and approve them together instead of one-by-one.
                // Each is still human-selected — nothing is auto-approved.
                const toolbar = el("div", "bulk-toolbar");
                toolbar.style.cssText = "display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap;";
                const selectAll = el("input");
                selectAll.type = "checkbox";
                const selectAllLabel = el("label");
                selectAllLabel.style.cssText = "display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;";
                selectAllLabel.append(selectAll, document.createTextNode("select all"));
                const approveSelBtn = el("button", "btn-dismiss");
                approveSelBtn.textContent = "approve selected";
                approveSelBtn.disabled = true;
                const countSpan = el("span");
                countSpan.style.cssText = "font-size:12px;opacity:0.7;";
                function updateBulkCount() {
                    const n = container.querySelectorAll(".pending-check:checked").length;
                    countSpan.textContent = n ? `${n} selected` : "";
                    approveSelBtn.textContent = n ? `approve selected (${n})` : "approve selected";
                    approveSelBtn.disabled = n === 0;
                }
                selectAll.addEventListener("change", () => {
                    container.querySelectorAll(".pending-check").forEach(cb => { cb.checked = selectAll.checked; });
                    updateBulkCount();
                });
                approveSelBtn.addEventListener("click", async () => {
                    const ids = [...container.querySelectorAll(".pending-check:checked")].map(cb => cb.dataset.id);
                    if (!ids.length) return;
                    if (!confirm(`approve and publish ${ids.length} post(s)?`)) return;
                    approveSelBtn.disabled = true;
                    for (const id of ids) { await approvePending(id); }
                    selectAll.checked = false;
                    updateBulkCount();
                });
                toolbar.append(selectAllLabel, approveSelBtn, countSpan);
                container.appendChild(toolbar);

                snap.docs.forEach(d => {
                    const p = d.data();
                    const detectedAt = p.pendingDetectedAt?.toDate?.()
                        ?? p.flaggedAt?.toDate?.()
                        ?? p.createdAt?.toDate?.();
                    const time = detectedAt ? timeAgo(detectedAt) : "unknown";
                    const reasonKey = typeof p.pendingReason === "string" ? p.pendingReason : "";
                    const reasonText = PENDING_REASON_LABELS[reasonKey] || reasonKey || "held for review";

                    const check = el("input", "pending-check");
                    check.type = "checkbox";
                    check.dataset.id = d.id;
                    check.style.cssText = "margin-right:8px;";
                    check.setAttribute("aria-label", "select post for bulk approve");
                    check.addEventListener("change", updateBulkCount);

                    const approveBtn = el("button", "btn-dismiss");
                    approveBtn.textContent = "approve (publish)";
                    approveBtn.addEventListener("click", () => approvePending(d.id));

                    const deleteBtn = el("button", "btn-remove");
                    deleteBtn.textContent = "remove post";
                    deleteBtn.addEventListener("click", () => deletePost(d.id));

                    const card = renderCard({
                        id: `pending-${d.id}`,
                        leading: check,
                        headerLeft: [span("flagged-label", reasonText)],
                        time,
                        text: p.text || "",
                        meta: [
                            `by: ${p.authorHandle || "unknown"}`,
                            typeof p.autoHiddenReportCount === "number"
                                ? `reports: ${p.autoHiddenReportCount}` : null,
                        ],
                        actions: [approveBtn, deleteBtn, restrictAuthorButton(p.authorId, p.authorHandle)],
                    });
                    container.appendChild(card);
                });
            } catch (e) {
                container.replaceChildren();
                const errDiv = el("div", "card");
                errDiv.textContent = `error loading pending posts: ${e.message}`;
                container.appendChild(errDiv);
            }
        }

        async function approvePending(postId) {
            try {
                // Flip back to "live" + null out the pending markers so the
                // post stops appearing on this tab and starts appearing in
                // the feed again. Keep flagged / flagReason / concerningContent
                // intact for audit trail; only the visibility gate changes.
                const uid = auth.currentUser?.uid || "";
                await updateDoc(doc(db, "posts", postId), {
                    moderationStatus: "live",
                    pendingApprovedAt: serverTimestamp(),
                    pendingApprovedBy: uid,
                });
                const card = document.getElementById(`pending-${postId}`);
                if (card) card.remove();
                refreshCounts();
            } catch (e) {
                alert(`couldn't approve: ${e.message}`);
            }
        }

        // --- Pending replies (M-1) ---
        //
        // Replies held at moderationStatus == "pending_review" by validateReply /
        // onReplyUpdated / applyReplyModeration (PII or links). The author still
        // sees their own held reply with an "under review" banner; everyone else
        // is denied by the reply read rule. Approve flips it back to "live" so it
        // rejoins the thread; remove deletes it. Uses a collectionGroup query
        // (admins get a dedicated leg in firestore.rules) ordered by
        // pendingDetectedAt DESC. Index: replies(moderationStatus, pendingDetectedAt DESC).

        async function loadPendingReplies(container) {
            try {
                const q = query(
                    collectionGroup(db, "replies"),
                    where("moderationStatus", "==", "pending_review"),
                    orderBy("pendingDetectedAt", "desc"),
                    limit(50)
                );
                const snap = await getDocs(q);
                if (snap.empty) {
                    emptyState(container, "no replies pending review", "auto-detection is keeping the queue clear");
                    return;
                }
                container.replaceChildren();
                container.appendChild(queueHeading("replies held for review"));
                snap.docs.forEach(d => {
                    const r = d.data();
                    const detectedAt = r.pendingDetectedAt?.toDate?.() ?? r.createdAt?.toDate?.();
                    const time = detectedAt ? timeAgo(detectedAt) : "unknown";
                    const reasonKey = typeof r.pendingReason === "string" ? r.pendingReason : "";
                    const reasonText = PENDING_REASON_LABELS[reasonKey] || reasonKey || "held for review";

                    const approveBtn = el("button", "btn-dismiss");
                    approveBtn.textContent = "approve (publish)";
                    approveBtn.addEventListener("click", () => approvePendingReply(d.ref, d.id));

                    const deleteBtn = el("button", "btn-remove");
                    deleteBtn.textContent = "remove reply";
                    deleteBtn.addEventListener("click", () => removeReply(d.ref, d.id));

                    const card = renderCard({
                        id: `pendingreply-${d.id}`,
                        headerLeft: [
                            span("card-type type-reply", "reply"),
                            span("flagged-label", reasonText),
                        ],
                        time,
                        text: r.text || "",
                        meta: [
                            `by: ${r.authorHandle || "unknown"}`,
                            `on post by: ${r.parentPostHandle || "unknown"}`,
                        ],
                        actions: [approveBtn, deleteBtn, restrictAuthorButton(r.authorId, r.authorHandle)],
                    });
                    container.appendChild(card);
                });
            } catch (e) {
                container.replaceChildren();
                const errDiv = el("div", "card");
                errDiv.textContent = `error loading pending replies: ${e.message}`;
                container.appendChild(errDiv);
            }
        }

        async function approvePendingReply(replyRef, cardKey) {
            try {
                const uid = auth.currentUser?.uid || "";
                await updateDoc(replyRef, {
                    moderationStatus: "live",
                    pendingApprovedAt: serverTimestamp(),
                    pendingApprovedBy: uid,
                });
                document.getElementById(`pendingreply-${cardKey}`)?.remove();
                refreshCounts();
            } catch (e) {
                alert(`couldn't approve: ${e.message}`);
            }
        }

        async function removeReply(replyRef, cardKey) {
            if (!confirm("delete this reply permanently?")) return;
            try {
                await deleteDoc(replyRef);
                document.getElementById(`pendingreply-${cardKey}`)?.remove();
                refreshCounts();
                showToast("reply deleted");
            } catch (e) { showToast("error: " + e.message); }
        }

        // --- Crisis (concerningContent posts) ---
        //
        // Surfaces posts auto-tagged with concerningContent: true (the iOS
        // crisis-phrase detector + server mirror). Newest first. A reviewed
        // post sets crisisReviewedAt / crisisReviewedBy on the post doc and
        // is filtered out of this query so the list shrinks as the admin
        // works through it. The post itself stays in Firestore — reviewing
        // doesn't delete; use "delete post" for that.

        async function loadCrisis(container) {
            try {
                // Unreviewed crisis posts must NEVER hide behind reviewed ones.
                // crisisReviewedAt is set on review but is ABSENT (not null) on
                // unreviewed posts, so Firestore can't filter it server-side
                // without backfilling the field. Previously we fetched a single
                // limit(50) page newest-first and filtered un-reviewed in JS —
                // so once >50 concerning posts existed and the 50 newest were
                // all reviewed, an OLDER unreviewed crisis post (the exact case
                // that matters most) silently never surfaced.
                //
                // Fix: paginate newest-first with startAfter, accumulating
                // unreviewed posts across pages until we have a full screen
                // (TARGET) or run out / hit a scan cap. Each page is one
                // getDocs; the scan cap bounds worst-case reads.
                const TARGET = 50;          // unreviewed posts to surface
                const PAGE = 50;            // docs per page
                const MAX_PAGES = 12;       // scan ceiling (≤600 docs) — bounds reads
                const docs = [];
                let cursor = null;
                let pagesScanned = 0;
                let moreRemain = false;
                while (docs.length < TARGET && pagesScanned < MAX_PAGES) {
                    const parts = [
                        collection(db, "posts"),
                        where("concerningContent", "==", true),
                        orderBy("createdAt", "desc"),
                    ];
                    if (cursor) parts.push(startAfter(cursor));
                    parts.push(limit(PAGE));
                    const snap = await getDocs(query(...parts));
                    pagesScanned++;
                    if (snap.empty) break;
                    for (const d of snap.docs) {
                        if (!d.data().crisisReviewedAt) docs.push(d);
                    }
                    cursor = snap.docs[snap.docs.length - 1];
                    if (snap.docs.length < PAGE) break;          // last page
                    if (pagesScanned >= MAX_PAGES) moreRemain = true; // cap, not exhaustion
                }
                if (docs.length === 0) {
                    emptyState(container, "no unreviewed crisis posts", "everything flagged has been reviewed");
                    return;
                }
                container.replaceChildren();
                container.appendChild(queueHeading("posts with concerning content"));
                if (moreRemain) {
                    const note = el("div", "card");
                    note.style.borderColor = "#c45c5c";
                    note.textContent = `showing ${docs.length} oldest-reachable unreviewed posts (scan cap hit — clear some and reload to reveal more).`;
                    container.appendChild(note);
                }
                docs.forEach(d => {
                    const p = d.data();
                    const time = p.createdAt?.toDate?.() ? timeAgo(p.createdAt.toDate()) : "unknown";

                    const reviewedBtn = el("button", "btn-dismiss");
                    reviewedBtn.textContent = "mark reviewed";
                    reviewedBtn.addEventListener("click", () => markCrisisReviewed(d.id));

                    const deleteBtn = el("button", "btn-remove");
                    deleteBtn.textContent = "delete post";
                    deleteBtn.addEventListener("click", () => deletePost(d.id));

                    const card = renderCard({
                        id: `crisis-${d.id}`,
                        headerLeft: [span("flagged-label", "concerning content")],
                        time,
                        text: p.text || "",
                        meta: [
                            `by: ${p.authorHandle || "unknown"}`,
                            `likes: ${p.likeCount || 0}`,
                            `replies: ${p.replyCount || 0}`,
                        ],
                        actions: [reviewedBtn, deleteBtn, restrictAuthorButton(p.authorId, p.authorHandle)],
                    });
                    container.appendChild(card);
                });
            } catch (e) {
                container.replaceChildren();
                const errDiv = el("div", "card");
                errDiv.textContent = `error loading crisis posts: ${e.message}`;
                container.appendChild(errDiv);
            }
        }

        async function markCrisisReviewed(postId) {
            try {
                const uid = auth.currentUser?.uid || "";
                await updateDoc(doc(db, "posts", postId), {
                    crisisReviewedAt: serverTimestamp(),
                    crisisReviewedBy: uid,
                });
                const card = document.getElementById(`crisis-${postId}`);
                if (card) card.remove();
                refreshCounts();
            } catch (e) {
                alert(`couldn't mark reviewed: ${e.message}`);
            }
        }

        // --- Reports ---

        async function loadReports(container) {
            try {
                const q = query(collection(db, "reports"), where("status", "==", "pending"), orderBy("createdAt", "desc"), limit(50));
                const snap = await getDocs(q);
                document.getElementById("pendingCount").textContent = snap.size;

                if (snap.empty) {
                    document.getElementById("overdueCount").textContent = 0;
                    emptyState(container, "nothing to review", "no pending reports right now");
                    return;
                }

                container.replaceChildren();
                container.appendChild(queueHeading("pending reports"));
                let overdueCount = 0;
                const now = Date.now();
                const TWELVE_HOURS_MS = 12 * 3600 * 1000;
                const TWENTY_FOUR_HOURS_MS = 24 * 3600 * 1000;
                snap.forEach(d => {
                    const r = d.data();
                    const reportDate = r.createdAt?.toDate?.() || null;
                    const time = reportDate ? timeAgo(reportDate) : "unknown";
                    // H-1: classify each pending report against the
                    // 24-hour review SLA the in-app ReportSheet promises.
                    // Overdue (>24h) → red border + count badge. Aging
                    // (>12h) → amber so the admin sees what's about to
                    // miss SLA before it does.
                    const ageMs = reportDate ? now - reportDate.getTime() : 0;
                    let slaClass = "";
                    let slaBadge = null;
                    if (ageMs > TWENTY_FOUR_HOURS_MS) {
                        slaClass = "overdue";
                        slaBadge = span("sla-badge sla-overdue", "overdue");
                        overdueCount += 1;
                    } else if (ageMs > TWELVE_HOURS_MS) {
                        slaClass = "aging";
                        slaBadge = span("sla-badge sla-aging", "aging");
                    }

                    const reasonText = r.reasonLabel || r.reason || "";

                    const dismissBtn = el("button", "btn-dismiss");
                    dismissBtn.textContent = "dismiss";
                    dismissBtn.addEventListener("click", () => dismissReport(d.id));

                    let removeBtn = null;
                    if (r.postId) {
                        removeBtn = el("button", "btn-remove");
                        removeBtn.textContent = "remove post";
                        removeBtn.addEventListener("click", () => removePost(d.id, r.postId));
                    }

                    let restrictBtn = null;
                    if (r.reportedUserId) {
                        restrictBtn = el("button", "btn-restrict");
                        restrictBtn.textContent = "restrict user";
                        restrictBtn.setAttribute("aria-label", `restrict user ${r.reportedHandle || r.reportedUserId}`);
                        restrictBtn.addEventListener("click", () => restrictUser(d.id, r.reportedUserId, r.reportedHandle));
                    }

                    // .slice(0,8) on the post id is a display nicety; the full
                    // id stays in the removeBtn closure above so the action
                    // hits the correct doc. Both flow through textContent.
                    const card = renderCard({
                        id: `report-${d.id}`,
                        extraClass: slaClass,
                        groupHeaderLeft: true,
                        headerLeft: [typeBadge(r.type), slaBadge],
                        time,
                        reason: `reason: ${reasonText}`,
                        text: r.text || "",
                        meta: [
                            `reported: ${r.reportedHandle || "unknown"}`,
                            r.postId ? `post: ${String(r.postId).slice(0, 8)}...` : null,
                        ],
                        actions: [dismissBtn, removeBtn, restrictBtn],
                    });
                    container.appendChild(card);
                });
                document.getElementById("overdueCount").textContent = overdueCount;
            } catch (e) {
                emptyState(container, "error loading reports", e.message);
            }
        }

        // --- Flagged posts ---

        async function loadFlagged(container) {
            try {
                const q = query(collection(db, "posts"), where("flagged", "==", true), orderBy("createdAt", "desc"), limit(50));
                const snap = await getDocs(q);
                document.getElementById("flaggedCount").textContent = snap.size;

                if (snap.empty) {
                    emptyState(container, "no flagged posts", "auto-moderation hasn't flagged anything");
                    return;
                }

                container.replaceChildren();
                container.appendChild(queueHeading("flagged posts"));
                snap.forEach(d => {
                    const p = d.data();
                    const time = p.createdAt?.toDate?.() ? timeAgo(p.createdAt.toDate()) : "unknown";

                    const unflagBtn = el("button", "btn-dismiss");
                    unflagBtn.textContent = "unflag (false positive)";
                    unflagBtn.addEventListener("click", () => unflagPost(d.id));

                    const deleteBtn = el("button", "btn-remove");
                    deleteBtn.textContent = "delete post";
                    deleteBtn.addEventListener("click", () => deletePost(d.id));

                    const card = renderCard({
                        id: `flagged-${d.id}`,
                        headerLeft: [span("flagged-label", p.flagReason || "flagged")],
                        time,
                        text: p.text || "",
                        meta: [
                            `by: ${p.authorHandle || "unknown"}`,
                            `likes: ${p.likeCount || 0}`,
                            `replies: ${p.replyCount || 0}`,
                        ],
                        actions: [unflagBtn, deleteBtn, restrictAuthorButton(p.authorId, p.authorHandle)],
                    });
                    container.appendChild(card);
                });
            } catch (e) {
                emptyState(container, "error loading flagged posts", e.message);
            }
        }

        // --- Restricted users ---

        async function loadRestricted(container) {
            try {
                const q = query(collection(db, "users"), where("restricted", "==", true), limit(50));
                const snap = await getDocs(q);

                if (snap.empty) {
                    emptyState(container, "no restricted users", "nobody is currently restricted");
                    return;
                }

                container.replaceChildren();
                container.appendChild(queueHeading("restricted users"));
                snap.forEach(d => {
                    const u = d.data();
                    const restrictedAtStr = u.restrictedAt?.toDate?.() ? timeAgo(u.restrictedAt.toDate()) : "";

                    const unrestrictBtn = el("button", "btn-dismiss");
                    unrestrictBtn.textContent = "unrestrict";
                    unrestrictBtn.addEventListener("click", () => unrestrictUser(d.id));

                    const card = renderCard({
                        id: `user-${d.id}`,
                        headerLeft: [span("card-type type-user", u.handle || "unknown")],
                        time: restrictedAtStr,
                        meta: [
                            `posts: ${u.postCount || 0}`,
                            `followers: ${u.followerCount || 0}`,
                        ],
                        actions: [unrestrictBtn],
                    });
                    container.appendChild(card);
                });
            } catch (e) {
                emptyState(container, "error loading users", e.message);
            }
        }

        // --- Actions ---
        // No `window.X = ...` exports because we no longer use inline onclick.
        // All buttons are wired via addEventListener inside the render loops.

        async function dismissReport(reportId) {
            const uid = auth.currentUser.uid;
            try {
                await updateDoc(doc(db, "reports", reportId), { status: "dismissed", reviewedBy: uid, reviewedAt: serverTimestamp(), action: "dismissed" });
                document.getElementById(`report-${reportId}`)?.remove();
                refreshCounts();
                showToast("report dismissed");
            } catch (e) { showToast("error: " + e.message); }
        }

        async function removePost(reportId, postId) {
            if (!confirm("delete this post permanently?")) return;
            const uid = auth.currentUser.uid;
            try {
                // Stamp the acting admin BEFORE deleting so auditPostDeletion
                // (functions/index.js) reads deletedBy off the doc's last state
                // and attributes the removal to this admin rather than "author".
                await updateDoc(doc(db, "posts", postId), { deletedBy: uid, deletedAt: serverTimestamp() });
                await deleteDoc(doc(db, "posts", postId));
                await updateDoc(doc(db, "reports", reportId), { status: "resolved", reviewedBy: uid, reviewedAt: serverTimestamp(), action: "post_deleted" });
                document.getElementById(`report-${reportId}`)?.remove();
                refreshCounts();
                showToast("post deleted, report resolved");
            } catch (e) { showToast("error: " + e.message); }
        }

        async function restrictUser(reportId, userId, handle) {
            // confirm() renders the message as plain text — no XSS risk
            // even if `handle` contains markup. Same for showToast below.
            if (!confirm(`restrict ${handle || userId}? they won't be able to post.`)) return;
            const uid = auth.currentUser.uid;
            try {
                await updateDoc(doc(db, "users", userId), { restricted: true, restrictedAt: serverTimestamp(), restrictedBy: uid });
                await updateDoc(doc(db, "reports", reportId), { status: "resolved", reviewedBy: uid, reviewedAt: serverTimestamp(), action: "user_restricted" });
                document.getElementById(`report-${reportId}`)?.remove();
                refreshCounts();
                showToast(`${handle || "user"} restricted`);
            } catch (e) { showToast("error: " + e.message); }
        }

        async function restrictUserDirect(userId, handle) {
            if (!confirm(`restrict ${handle || userId}?`)) return;
            const uid = auth.currentUser.uid;
            try {
                await updateDoc(doc(db, "users", userId), { restricted: true, restrictedAt: serverTimestamp(), restrictedBy: uid });
                refreshCounts();
                showToast(`${handle || "user"} restricted`);
            } catch (e) { showToast("error: " + e.message); }
        }

        async function unflagPost(postId) {
            try {
                // Clearing flagged alone wasn't enough — DailyMomentView,
                // WeeklyRecapView, TopView, FeedViewModel, OtherProfileView,
                // and ProfileView all also filter on `concerningContent`,
                // so a post that was flagged AND marked concerning would
                // stay hidden from feeds even after the appeal succeeded.
                // Clear all three so the post is fully restored to feeds.
                //
                // unflaggedBy/unflaggedAt are the actor stamp for the audit
                // trail: restoring previously-flagged (incl. crisis) content to
                // public feeds is the most sensitive moderation reversal, and
                // auditPostModeration (functions/index.js) keys a "post.unflag"
                // entry on unflaggedBy newly appearing.
                await updateDoc(doc(db, "posts", postId), {
                    flagged: false,
                    concerningContent: false,
                    flagReason: null,
                    unflaggedBy: auth.currentUser.uid,
                    unflaggedAt: serverTimestamp()
                });
                document.getElementById(`flagged-${postId}`)?.remove();
                refreshCounts();
                showToast("post unflagged — now visible in feeds");
            } catch (e) { showToast("error: " + e.message); }
        }

        async function deletePost(postId) {
            if (!confirm("delete this post permanently?")) return;
            try {
                // Stamp the acting admin BEFORE deleting so auditPostDeletion
                // (functions/index.js) attributes the removal to this admin
                // rather than falling back to "author".
                await updateDoc(doc(db, "posts", postId), { deletedBy: auth.currentUser.uid, deletedAt: serverTimestamp() });
                await deleteDoc(doc(db, "posts", postId));
                document.getElementById(`flagged-${postId}`)?.remove();
                refreshCounts();
                showToast("post deleted");
            } catch (e) { showToast("error: " + e.message); }
        }

        async function unrestrictUser(userId) {
            if (!confirm("unrestrict this user? they'll be able to post again.")) return;
            try {
                await updateDoc(doc(db, "users", userId), { restricted: false, restrictedAt: serverTimestamp(), restrictedBy: auth.currentUser.uid });
                document.getElementById(`user-${userId}`)?.remove();
                refreshCounts();
                showToast("user unrestricted");
            } catch (e) { showToast("error: " + e.message); }
        }

        // --- Helpers ---

        function timeAgo(date) {
            const s = Math.floor((Date.now() - date.getTime()) / 1000);
            if (s < 60) return "just now";
            if (s < 3600) return Math.floor(s / 60) + "m ago";
            if (s < 86400) return Math.floor(s / 3600) + "h ago";
            return Math.floor(s / 86400) + "d ago";
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 2500);
        }
    </script>
</body>
</html>
