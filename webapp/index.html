<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toska</title>
    <meta name="description" content="toska — an anonymous space for heartbreak. sign in to read the feed.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0a10'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' fill='%236d55c9' text-anchor='middle'%3Et%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- perf: warm the connections the app hits immediately after JS loads -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <!-- perf: the module graph is 4 levels deep — declare it up front so
         every file downloads in parallel instead of by discovery order -->
    <link rel="modulepreload" href="/js/app.js">
    <link rel="modulepreload" href="/js/config.js">
    <link rel="modulepreload" href="/js/writes.js">
    <link rel="modulepreload" href="/js/gates.js">
    <link rel="modulepreload" href="/js/moderation.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-functions.js" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="app" id="appHeader" hidden>
        <div class="inner">
            <a class="wordmark" href="#/"><b>toska</b></a>
            <div style="display:flex; gap:14px; align-items:center;">
                <button class="btn write-top" id="writeFab" onclick="location.hash='#/compose'">+ write</button>
                <button class="tab" id="signOutBtn">sign out</button>
            </div>
        </div>
    </header>
    <nav class="mainnav sans" id="mainNav" hidden>
            <a href="#/" data-nav="feed">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h12M4 18h15"/></svg>
                <span>feed</span>
            </a>
            <a href="#/top" data-nav="top">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.7-9.3-9.3C1.4 7.9 3.6 4.5 7 4.5c2.2 0 3.9 1.3 5 3 1.1-1.7 2.8-3 5-3 3.4 0 5.6 3.4 4.3 6.7-1.8 4.6-9.3 9.3-9.3 9.3z"/></svg>
                <span>most felt</span>
            </a>
            <a href="#/notifications" data-nav="notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 10-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5"/><path d="M13.7 20a2 2 0 01-3.4 0"/></svg>
                <span>notifications</span><span class="dot" id="notifDot" hidden></span>
            </a>
            <a href="#/me" data-nav="me">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.7"/><path d="M4.5 20c1.4-3.2 4.2-4.8 7.5-4.8s6.1 1.6 7.5 4.8"/></svg>
                <span>profile</span>
            </a>
        </nav>
    <main class="shell" id="mount">
        <span class="spinner"></span>
    </main>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
